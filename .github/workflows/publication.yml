name: Clean import-generated source caches
on:
  push:
    paths:
      - .github/workflows/publication.yml
permissions:
  contents: read
jobs:
  clean:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove only generated bytecode and verify exact source files
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, subprocess, zipfile
          archive=Path('NHANES_CardioBench_v0.4.8.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='111a8dabac75b9fedb1526e9a04005cae8a8e6e1e45254a4773a7e4ad7866c53'
          expected={}
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  parts=PurePosixPath(item.filename).parts
                  assert parts[0]=='NHANES_CardioBench_v0_4_8_Software' and len(parts)>1
                  expected[str(PurePosixPath('software',*parts[1:]))]=z.read(item)
          assert len(expected)==643
          tracked=subprocess.check_output(['git','ls-files','-z','software']).decode().split('\0')
          extras=[p for p in tracked if p and p not in expected]
          for name in extras:
              path=PurePosixPath(name)
              assert '__pycache__' in path.parts and path.suffix=='.pyc', name
              subprocess.check_call(['git','rm','--',name])
          for name,data in expected.items():
              assert Path(name).read_bytes()==data, name
          print('Verified all 643 delivery files and removed',len(extras),'generated caches.')
      - name: Verify complete delivery without generating bytecode
        working-directory: software
        run: python -B -m cardiobench verify --require-artifacts
      - name: Commit source-cache cleanup
        shell: bash
        run: |
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove import-generated Python bytecode caches'
            git push origin HEAD:main
          fi
          test "$(git ls-files software | wc -l)" -eq 643
