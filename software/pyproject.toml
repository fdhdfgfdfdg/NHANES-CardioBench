[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhanes-cardiobench"
version = "0.4.8"
description = "Frozen NHANES metadata and synthetic analysis contract benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chuanhao Nie", email = "cnie30@gatech.edu"}, {name = "Yisong Chen", email = "ychen841@gatech.edu"}]
maintainers = [{name = "Yisong Chen", email = "ychen841@gatech.edu"}]
dependencies = []

[project.urls]
Repository = "https://github.com/fdhdfgfdfdg/NHANES-CardioBench"
Issues = "https://github.com/fdhdfgfdfdg/NHANES-CardioBench/issues"

[project.scripts]
cardiobench = "cardiobench.__main__:main"

[tool.setuptools]
packages = ["cardiobench"]
include-package-data = true

[tool.setuptools.package-data]
cardiobench = ["data/*.json"]
